# Kiểm tra tự động mỗi lần push / mở PR lên main.
# Chạy trên Windows vì dự án Windows-only (xem CLAUDE.md §Chỉ hỗ trợ Windows).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Cài thư viện
        run: python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Test (pytest)
        run: python -m pytest

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint — chỉ lỗi mới làm đỏ, cảnh báo vẫn qua)
        run: npx oxlint src
      - name: Build
        run: npm run build
