# Kiểm tra tự động mỗi lần push / mở PR lên main.
# Chạy trên Windows vì dự án Windows-only (xem CLAUDE.md §Chỉ hỗ trợ Windows).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # cần tag vX.Y.Z cho /api/system/info bản dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Cài thư viện
        run: python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check . ../tools
      - name: Test (pytest)
        run: python -m pytest

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint — chỉ lỗi mới làm đỏ, cảnh báo vẫn qua)
        run: npx oxlint src
      - name: Build
        run: npm run build

  e2e:
    # Backend THẬT (dữ liệu tạm) phục vụ frontend/dist, Chrome headless bấm như người
    # dùng — xem backend/tests/e2e/test_ui_smoke.py.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Cài thư viện
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Test đầu-cuối
        working-directory: backend
        run: python -m pytest -m e2e tests/e2e
